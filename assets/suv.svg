<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="100%" height="100%">
  <defs>
    <linearGradient id="suvGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="suvGlass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.1"/>
    </linearGradient>
  </defs>
  <rect width="600" height="320" fill="url(#suvGrad)" rx="12"/>
  <!-- Ambient glow -->
  <circle cx="300" cy="180" r="140" fill="#2563eb" fill-opacity="0.08"/>
  <!-- Ground line -->
  <line x1="40" y1="270" x2="560" y2="270" stroke="#334155" stroke-width="1.5" stroke-dasharray="8 6"/>
  <!-- Shadow -->
  <ellipse cx="300" cy="265" rx="220" ry="14" fill="#020617" opacity="0.8"/>
  
  <!-- SUV Body Shell -->
  <path d="M 90 225 
           L 100 190 
           L 145 170 
           L 225 155 
           L 280 95 
           L 440 95 
           L 490 145 
           L 515 185 
           L 515 230 
           L 470 230 
           A 42 42 0 0 0 386 230 
           L 214 230 
           A 42 42 0 0 0 130 230 
           Z" 
        fill="#334155" stroke="#64748b" stroke-width="2"/>
  
  <!-- Ballistic Greenhouse Glass -->
  <polygon points="285,102 240,152 340,152 340,102" fill="url(#suvGlass)" stroke="#38bdf8" stroke-width="1.5"/>
  <polygon points="348,102 348,152 425,152 425,102" fill="url(#suvGlass)" stroke="#38bdf8" stroke-width="1.5"/>
  <polygon points="433,103 433,152 475,152" fill="url(#suvGlass)" stroke="#38bdf8" stroke-width="1.5"/>

  <!-- Character lines & Door Overlaps -->
  <line x1="344" y1="102" x2="344" y2="228" stroke="#0ea5e9" stroke-width="2"/>
  <line x1="429" y1="102" x2="429" y2="228" stroke="#0ea5e9" stroke-width="1.5"/>
  <line x1="145" y1="170" x2="510" y2="185" stroke="#94a3b8" stroke-width="1.2" opacity="0.7"/>

  <!-- Front Wheel -->
  <g transform="translate(172, 230)">
    <circle cx="0" cy="0" r="38" fill="#090d16" stroke="#475569" stroke-width="3"/>
    <circle cx="0" cy="0" r="24" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="14" fill="#0284c7" opacity="0.6"/>
    <circle cx="0" cy="0" r="5" fill="#f8fafc"/>
  </g>

  <!-- Rear Wheel -->
  <g transform="translate(428, 230)">
    <circle cx="0" cy="0" r="38" fill="#090d16" stroke="#475569" stroke-width="3"/>
    <circle cx="0" cy="0" r="24" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="14" fill="#0284c7" opacity="0.6"/>
    <circle cx="0" cy="0" r="5" fill="#f8fafc"/>
  </g>

  <!-- Level Badge -->
  <g transform="translate(480, 40)">
    <rect x="-40" y="-14" width="80" height="28" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="0" y="5" fill="#f59e0b" font-size="11" font-family="monospace" font-weight="bold" text-anchor="middle">CEN B6/B7</text>
  </g>
  <text x="40" y="50" fill="#94a3b8" font-size="12" font-family="monospace" letter-spacing="1.5">FLAGSHIP LUXURY SUV</text>
</svg>
