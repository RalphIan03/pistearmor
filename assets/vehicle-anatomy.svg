<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="100%" height="100%">
  <defs>
    <linearGradient id="armorGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="goldGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" opacity="0.6"/>
    </pattern>
  </defs>

  <!-- Background Grid -->
  <rect width="1000" height="500" fill="url(#armorGlow)" rx="16"/>
  <rect width="1000" height="500" fill="url(#grid)" rx="16"/>

  <!-- Blueprint Dimension Lines & Tactical Markers -->
  <g stroke="#334155" stroke-width="1" stroke-dasharray="4 4" opacity="0.7">
    <line x1="80" y1="60" x2="920" y2="60"/>
    <line x1="80" y1="440" x2="920" y2="440"/>
    <line x1="80" y1="60" x2="80" y2="440"/>
    <line x1="920" y1="60" x2="920" y2="440"/>
  </g>

  <!-- Ground Shadow -->
  <ellipse cx="500" cy="405" rx="360" ry="22" fill="#000000" opacity="0.75"/>

  <!-- Vehicle Silhouette / Schematic Chassis -->
  <!-- Main Body Shell -->
  <path d="M 170 340 
           L 180 290 
           L 240 260 
           L 380 240 
           L 460 160 
           L 730 160 
           L 810 230 
           L 845 285 
           L 845 350 
           L 765 350 
           A 65 65 0 0 0 635 350 
           L 375 350 
           A 65 65 0 0 0 245 350 
           Z" 
        fill="#1e293b" stroke="#475569" stroke-width="2.5"/>

  <!-- Reinforced Ballistic Cabin Capsule (Highlighted in Tactical Blue) -->
  <path d="M 390 245 
           L 462 170 
           L 725 170 
           L 790 235 
           L 790 335 
           L 390 335 
           Z" 
        fill="#0284c7" fill-opacity="0.12" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6 3"/>

  <!-- Ballistic Glass Greenhouse -->
  <!-- Windshield -->
  <polygon points="468,175 410,242 470,242 505,175" fill="#38bdf8" fill-opacity="0.3" stroke="#7dd3fc" stroke-width="2"/>
  <!-- Front Side Window -->
  <polygon points="515,175 480,242 610,242 610,175" fill="#38bdf8" fill-opacity="0.25" stroke="#7dd3fc" stroke-width="2"/>
  <!-- Rear Side Window -->
  <polygon points="620,175 620,242 710,242 710,175" fill="#38bdf8" fill-opacity="0.25" stroke="#7dd3fc" stroke-width="2"/>
  <!-- Quarter Glass -->
  <polygon points="720,177 720,242 778,242" fill="#38bdf8" fill-opacity="0.25" stroke="#7dd3fc" stroke-width="2"/>

  <!-- Overlap Protection Seams on Door Pillars -->
  <line x1="615" y1="170" x2="615" y2="345" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
  <line x1="475" y1="245" x2="475" y2="345" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
  <line x1="715" y1="170" x2="715" y2="345" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>

  <!-- Underbelly Blast Shield (Heavy Kevlar / Armored Plate) -->
  <rect x="250" y="345" width="510" height="12" rx="4" fill="#d97706" fill-opacity="0.4" stroke="#f59e0b" stroke-width="2"/>

  <!-- Wheels with Run-Flat System Inserts -->
  <!-- Front Wheel -->
  <g transform="translate(310, 350)">
    <circle cx="0" cy="0" r="58" fill="#090d16" stroke="#475569" stroke-width="4"/>
    <circle cx="0" cy="0" r="42" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <!-- Runflat Composite Ring -->
    <circle cx="0" cy="0" r="30" fill="none" stroke="#f59e0b" stroke-width="4" stroke-dasharray="10 4"/>
    <circle cx="0" cy="0" r="16" fill="#0284c7" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="0" cy="0" r="6" fill="#ffffff"/>
  </g>

  <!-- Rear Wheel -->
  <g transform="translate(700, 350)">
    <circle cx="0" cy="0" r="58" fill="#090d16" stroke="#475569" stroke-width="4"/>
    <circle cx="0" cy="0" r="42" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <!-- Runflat Composite Ring -->
    <circle cx="0" cy="0" r="30" fill="none" stroke="#f59e0b" stroke-width="4" stroke-dasharray="10 4"/>
    <circle cx="0" cy="0" r="16" fill="#0284c7" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="0" cy="0" r="6" fill="#ffffff"/>
  </g>

  <!-- Protected Battery & ECM Box in Engine Bay -->
  <rect x="220" y="270" width="55" height="38" rx="4" fill="#ef4444" fill-opacity="0.25" stroke="#ef4444" stroke-width="2"/>
  <text x="247" y="293" fill="#fca5a5" font-size="11" font-family="monospace" text-anchor="middle" font-weight="bold">ECU</text>

  <!-- Fuel Tank Armor Shield -->
  <rect x="585" y="325" width="60" height="20" rx="3" fill="#f59e0b" fill-opacity="0.3" stroke="#f59e0b" stroke-width="1.8"/>

  <!-- Hotspot Callouts & Labels -->
  <!-- 1: Ballistic Glass -->
  <g class="hotspot" transform="translate(545, 155)">
    <circle cx="0" cy="0" r="14" fill="#0284c7" stroke="#ffffff" stroke-width="2.5"/>
    <text x="0" y="5" fill="#ffffff" font-size="12" font-family="sans-serif" font-weight="bold" text-anchor="middle">1</text>
  </g>

  <!-- 2: Overlap Seam System -->
  <g class="hotspot" transform="translate(615, 275)">
    <circle cx="0" cy="0" r="14" fill="#d97706" stroke="#ffffff" stroke-width="2.5"/>
    <text x="0" y="5" fill="#ffffff" font-size="12" font-family="sans-serif" font-weight="bold" text-anchor="middle">2</text>
  </g>

  <!-- 3: Ballistic Steel Capsule -->
  <g class="hotspot" transform="translate(485, 300)">
    <circle cx="0" cy="0" r="14" fill="#0284c7" stroke="#ffffff" stroke-width="2.5"/>
    <text x="0" y="5" fill="#ffffff" font-size="12" font-family="sans-serif" font-weight="bold" text-anchor="middle">3</text>
  </g>

  <!-- 4: Blast Floor Shield -->
  <g class="hotspot" transform="translate(420, 385)">
    <circle cx="0" cy="0" r="14" fill="#d97706" stroke="#ffffff" stroke-width="2.5"/>
    <text x="0" y="5" fill="#ffffff" font-size="12" font-family="sans-serif" font-weight="bold" text-anchor="middle">4</text>
  </g>

  <!-- 5: Run-Flat Tire Inserts -->
  <g class="hotspot" transform="translate(310, 425)">
    <circle cx="0" cy="0" r="14" fill="#0284c7" stroke="#ffffff" stroke-width="2.5"/>
    <text x="0" y="5" fill="#ffffff" font-size="12" font-family="sans-serif" font-weight="bold" text-anchor="middle">5</text>
  </g>

  <!-- 6: ECM & Battery Armor -->
  <g class="hotspot" transform="translate(247, 245)">
    <circle cx="0" cy="0" r="14" fill="#ef4444" stroke="#ffffff" stroke-width="2.5"/>
    <text x="0" y="5" fill="#ffffff" font-size="12" font-family="sans-serif" font-weight="bold" text-anchor="middle">6</text>
  </g>

  <!-- Technical Spec Watermark Header -->
  <text x="90" y="90" fill="#94a3b8" font-family="monospace" font-size="14" letter-spacing="2">BALLISTIC RETROFIT CAD SCHEMATIC // CEN EN 1063 B6 / VPAM VR7</text>
  <text x="90" y="112" fill="#64748b" font-family="monospace" font-size="11">PERIMETER OVERLAP • 39MM SPALL-SHIELD GLASS • RUN-FLAT MULTI-ZONE</text>
</svg>
