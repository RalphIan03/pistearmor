<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="100%" height="100%">
  <defs>
    <linearGradient id="citGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="600" height="320" fill="url(#citGrad)" rx="12"/>
  <circle cx="300" cy="180" r="140" fill="#f59e0b" fill-opacity="0.05"/>
  <line x1="40" y1="270" x2="560" y2="270" stroke="#334155" stroke-width="1.5" stroke-dasharray="8 6"/>
  <ellipse cx="300" cy="265" rx="230" ry="14" fill="#020617" opacity="0.8"/>
  
  <!-- CIT Heavy Van Body Shell -->
  <path d="M 80 230 
           L 90 170 
           L 155 130 
           L 210 90 
           L 515 90 
           L 515 230 
           L 465 230 
           A 42 42 0 0 0 381 230 
           L 209 230 
           A 42 42 0 0 0 125 230 
           Z" 
        fill="#334155" stroke="#64748b" stroke-width="2"/>
  
  <!-- Reinforced Ballistic Windshield & Cab Windows -->
  <polygon points="205,98 160,135 255,135 255,98" fill="#38bdf8" fill-opacity="0.25" stroke="#38bdf8" stroke-width="1.5"/>
  <rect x="265" y="100" width="45" height="32" rx="4" fill="#38bdf8" fill-opacity="0.2" stroke="#38bdf8" stroke-width="1.2"/>

  <!-- Gunports (Tactical CIT feature) -->
  <circle cx="370" cy="160" r="8" fill="#0f172a" stroke="#f59e0b" stroke-width="2"/>
  <circle cx="450" cy="160" r="8" fill="#0f172a" stroke="#f59e0b" stroke-width="2"/>

  <!-- Vault Compartment Outline -->
  <rect x="330" y="105" width="170" height="110" rx="4" fill="#0284c7" fill-opacity="0.08" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="415" y="140" fill="#94a3b8" font-size="10" font-family="monospace" text-anchor="middle">ARMORED VAULT</text>

  <!-- Heavy Duty Wheels (Dual rear axle hint) -->
  <g transform="translate(167, 230)">
    <circle cx="0" cy="0" r="40" fill="#090d16" stroke="#475569" stroke-width="3"/>
    <circle cx="0" cy="0" r="25" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="6" fill="#f8fafc"/>
  </g>

  <g transform="translate(423, 230)">
    <circle cx="0" cy="0" r="40" fill="#090d16" stroke="#475569" stroke-width="3"/>
    <circle cx="0" cy="0" r="25" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="6" fill="#f8fafc"/>
  </g>

  <!-- Level Badge -->
  <g transform="translate(480, 40)">
    <rect x="-40" y="-14" width="80" height="28" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="0" y="5" fill="#f59e0b" font-size="11" font-family="monospace" font-weight="bold" text-anchor="middle">CEN B6+</text>
  </g>
  <text x="40" y="50" fill="#94a3b8" font-size="12" font-family="monospace" letter-spacing="1.5">CASH-IN-TRANSIT (CIT)</text>
</svg>
